# Relays the aviationweather.gov international SIGMET feed to the app.
# Browsers cannot read aviationweather.gov directly (it sends no CORS header), so this job copies the feed
# every 10 minutes to a single-commit branch, "sigmet-data", which the app reads from raw.githubusercontent.com.
# The branch is replaced each run (force push), so the repository history does not grow.
# If the fetch fails, nothing is published: the app then shows the last copy with its true age.
name: Publish SIGMET feed

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sigmet-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch international SIGMETs
        run: |
          set -euo pipefail
          mkdir feed
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -A "EDTO-CRZ-APP (https://github.com/${{ github.repository }})" \
            "https://aviationweather.gov/api/data/isigmet?format=json" -o feed/raw.json

      - name: Wrap with the time it was fetched
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("feed/raw.json", "utf8").trim();   // an empty body means no SIGMETs
            const records = text ? JSON.parse(text) : [];
            if (!Array.isArray(records)) throw new Error("Unexpected response from aviationweather.gov");
            fs.writeFileSync("feed/sigmet.json", JSON.stringify({ generatedAt: Date.now(), source: "https://aviationweather.gov/api/data/isigmet", records }));
            console.log(records.length + " SIGMET records");
          '
          rm feed/raw.json

      - name: Publish to the sigmet-data branch
        working-directory: feed
        run: |
          set -euo pipefail
          git init -q -b sigmet-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sigmet.json
          git commit -qm "SIGMET feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sigmet-data
